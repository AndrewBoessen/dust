name: Auto-tag

# Cuts a `vX.Y.Z` tag whenever the `VERSION` file changes on `main`, then
# dispatches `release.yml` for that tag.
#
# The tag is pushed with the built-in GITHUB_TOKEN, and GitHub suppresses
# `push:` triggers for token-driven pushes (recursion prevention) — so the
# tag alone will NOT start `release.yml`. We invoke it explicitly via
# `workflow_dispatch`, the same mechanism `rolling-release.yaml` uses.

on:
  push:
    branches: [main]
    paths: ["VERSION"]

permissions:
  contents: write
  actions: write

jobs:
  tag:
    name: Tag from VERSION
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag from VERSION
        id: tag
        run: |
          set -euo pipefail
          v="v$(tr -d '[:space:]' < VERSION)"

          if [ "$v" = "v" ]; then
            echo "VERSION file is empty"; exit 1
          fi

          if ! printf '%s' "${v#v}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION '${v#v}' is not X.Y.Z"; exit 1
          fi

          echo "tag=$v" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then
            echo "Tag $v already exists - nothing to do."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$v" -m "Release $v"
          git push origin "$v"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "Pushed $v"

      - name: Trigger release workflow for the new tag
        if: steps.tag.outputs.created == 'true'
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release.yml',
              ref: 'main',
              inputs: { tag: process.env.TAG },
            })
